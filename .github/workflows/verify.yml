name: Verify original-game source port

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test source preparation and snapshot validation
        run: python3 -m unittest discover -s tool -p 'test_*.py' -v

      - name: Verify original hashes and generate Dart
        run: |
          python3 tool/prepare_original.py
          python3 tool/prepare_audio.py --verify-only

      - name: Install Flutter 3.47.8
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check manually maintained Dart formatting
        run: find lib test tool -name '*.dart' ! -path 'lib/generated/*' -print0 | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Analyze (errors fail; generated-source lint warnings remain visible)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test original-program bridges and behavior
        run: flutter test --reporter expanded

      - name: Explain the checkpoint
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          This workflow verifies the preserved original source and its current Flutter bridges.
          Passing these checks does not establish complete gameplay, visual parity, or an installable iOS app.
          No IPA is created by this verification workflow.
          EOF
